openapi: 3.1.0
info:
  title: Travel Larper API
  version: 0.1.0
  description: HTTP contract between the Travel Larper frontend and backend.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the API and its database are reachable.
      tags: [system]
      responses:
        "200":
          description: The API and the database are up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The API is up but the database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      operationId: register
      summary: Create a user account, pending until an admin approves it.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account is created and pending approval.
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Open a session; whatever its status, the account can log in.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Close the current session, if any, and clear its cookie.
      tags: [auth]
      responses:
        "204":
          description: Logged out, even when there was no valid session.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: Return the logged-in user.
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The user of the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        default:
          $ref: "#/components/responses/Error"
  /countries/{code}:
    get:
      operationId: getCountryInfo
      summary: Return a country's currencies, languages and Wikivoyage summary (cached).
      description: "Public, like the globe. Unknown code: 404. The summary can be missing alone."
      tags: [countries]
      parameters:
        - name: code
          in: path
          required: true
          description: ISO 3166-1 alpha-2 code, upper case.
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
        - name: lang
          in: query
          required: true
          description: Language of the summary.
          schema:
            type: string
            enum: [en, fr]
      responses:
        "200":
          description: What is known of the country.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CountryInfo"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  headers:
    SessionCookie:
      description: The session cookie (HttpOnly, SameSite=Lax, Secure in production).
      schema:
        type: string
  responses:
    Error:
      description: Any error, in the shared Error format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_parameter
            - invalid_body
            - invalid_email
            - password_too_short
            - password_too_long
            - email_taken
            - invalid_credentials
            - unauthorized
            - not_found
            - method_not_allowed
            - request_too_large
            - rate_limited
            - internal_error
        message:
          type: string
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    CountryInfo:
      type: object
      required: [code, currencies, languages, summary]
      properties:
        code:
          type: string
        currencies:
          description: ISO 4217 codes; the frontend shows them in the user's language.
          type: array
          items:
            type: string
        languages:
          type: array
          items:
            $ref: "#/components/schemas/CountryLanguage"
        summary:
          $ref: "#/components/schemas/CountrySummary"
    CountryLanguage:
      description: The browser names it in the user's language, or the frontend uses `name` when it does not know it.
      type: object
      required: [code, name]
      properties:
        code:
          description: BCP 47 tag (fr, pt-BR).
          type: string
        name:
          description: Name in the language asked for (Wikidata, or REST Countries' English name).
          type: string
    CountrySummary:
      description: The first paragraph of the country's Wikivoyage article, in the language asked for.
      type: object
      required: [status]
      properties:
        status:
          description: missing when Wikivoyage has no article in this language; unavailable when it failed.
          type: string
          enum: [available, missing, unavailable]
        text:
          description: Plain text, set when available.
          type: string
        url:
          description: The article, for the source link; set when available.
          type: string
    CurrentUser:
      type: object
      required: [id, email, status]
      properties:
        id:
          type: string
          format: uuid
          # Same Go type as the sqlc models (oapi-codegen only).
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        email:
          type: string
        status:
          type: string
          enum: [pending, active, refused, suspended]
