openapi: 3.1.0
info:
  title: Travel Larper API
  version: 0.1.0
  description: HTTP contract between the Travel Larper frontend and backend.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the API and its database are reachable.
      tags: [system]
      responses:
        "200":
          description: The API and the database are up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The API is up but the database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
components:
  responses:
    Error:
      description: Any error, in the shared Error format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_parameter
            - not_found
            - method_not_allowed
            - request_too_large
            - rate_limited
            - internal_error
        message:
          type: string
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
