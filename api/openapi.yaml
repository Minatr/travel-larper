openapi: 3.1.0
info:
  title: Travel Larper API
  version: 0.1.0
  description: HTTP contract between the Travel Larper frontend and backend.
servers:
  - url: /api
paths:
  /health:
    get:
      operationId: getHealth
      summary: Report whether the API and its database are reachable.
      tags: [system]
      responses:
        "200":
          description: The API and the database are up.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The API is up but the database is unreachable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Error"
  /auth/register:
    post:
      operationId: register
      summary: Create a user account, pending until an admin approves it.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: The account is created and pending approval.
        default:
          $ref: "#/components/responses/Error"
  /auth/login:
    post:
      operationId: login
      summary: Open a session; whatever its status, the account can log in.
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Logged in; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        default:
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      operationId: logout
      summary: Close the current session, if any, and clear its cookie.
      tags: [auth]
      responses:
        "204":
          description: Logged out, even when there was no valid session.
          headers:
            Set-Cookie:
              $ref: "#/components/headers/SessionCookie"
        default:
          $ref: "#/components/responses/Error"
  /auth/me:
    get:
      operationId: getMe
      summary: Return the logged-in user.
      tags: [auth]
      security:
        - cookieAuth: []
      responses:
        "200":
          description: The user of the session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
        default:
          $ref: "#/components/responses/Error"
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: session
  headers:
    SessionCookie:
      description: The session cookie (HttpOnly, SameSite=Lax, Secure in production).
      schema:
        type: string
  responses:
    Error:
      description: Any error, in the shared Error format.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - invalid_parameter
            - invalid_body
            - invalid_display_name
            - invalid_email
            - password_too_short
            - password_too_long
            - email_taken
            - invalid_credentials
            - unauthorized
            - not_found
            - method_not_allowed
            - request_too_large
            - rate_limited
            - internal_error
        message:
          type: string
    Health:
      type: object
      required: [status, database]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        database:
          type: string
          enum: [up, down]
    RegisterRequest:
      type: object
      required: [displayName, email, password]
      properties:
        displayName:
          description: First name or nickname, shown to trip members; spaces around it are trimmed.
          type: string
          minLength: 2
          maxLength: 30
        email:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string
    CurrentUser:
      type: object
      required: [id, displayName, email, status]
      properties:
        id:
          type: string
          format: uuid
          # Same Go type as the sqlc models (oapi-codegen only).
          x-go-type: uuid.UUID
          x-go-type-import:
            path: github.com/google/uuid
        displayName:
          type: string
        email:
          type: string
        status:
          type: string
          enum: [pending, active, refused, suspended]
