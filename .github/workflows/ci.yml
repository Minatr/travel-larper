name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same branch cancels the run still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest 1.27.x rather than the minimum in go.mod: patch releases
          # carry the standard library security fixes govulncheck checks for.
          go-version: "1.27.x"
          cache-dependency-path: backend/go.sum
      - name: Lint and format check
        uses: golangci/golangci-lint-action@v8
        with:
          # Same version as on the developers' machines (README).
          version: v2.14.0
          working-directory: backend
      - name: Build
        run: go build ./...
      - name: Test
        run: go test ./...
  
      - name: Known vulnerabilities
        run: go tool govulncheck ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Type check and build
        run: npm run build
     
      - name: Known vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  # Fails when api/openapi.yaml changed but `make generate` was not run, so
  # the committed code always matches the contract.
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          # Latest 1.27.x rather than the minimum in go.mod: patch releases
          # carry the standard library security fixes govulncheck checks for.
          go-version: "1.27.x"
          cache-dependency-path: backend/go.sum
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: make generate
      - name: Check the generated code is committed and up to date
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --short
            git diff
            echo "::error::Generated code is out of date: run 'make generate' and commit the result."
            exit 1
          fi
