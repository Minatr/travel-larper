# Dependabot: security updates only.
#
# open-pull-requests-limit: 0 turns off the routine version updates. The
# security updates (enabled in the repository settings) still open a PR
# when a dependency has a known vulnerability and a fixed version exists.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: fix
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    commit-message:
      prefix: ci
